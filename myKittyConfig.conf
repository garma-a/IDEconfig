
# ============================================================
# KITTY — Minimal Developer Setup
# Ubuntu / GNOME | Neovim | Zsh | Codex
# ============================================================

# ── FONT ─────────────────────────────────────────────────────
font_family JetBrainsMono Nerd Font
font_size 12.0

# ── WINDOW APPEARANCE ────────────────────────────────────────
# Let GNOME draw the title bar and window controls through XWayland.
# Native Wayland decorations differ from GNOME, and fullscreen loses
# the transparent background on this GNOME session.
linux_display_server x11
hide_window_decorations no

# Small, comfortable spacing around terminal content
window_padding_width 6

# ── BACKGROUND & TRANSPARENCY ────────────────────────────────
background #000000
background_opacity 0.80
dynamic_background_opacity yes

# ── CURSOR ───────────────────────────────────────────────────
cursor_shape block
shell_integration no-cursor

# ── SOUND ────────────────────────────────────────────────────
enable_audio_bell no

# ── WINDOW MANAGEMENT ───────────────────────────────────────
# True fullscreen; XWayland preserves the configured transparency.
map f11 toggle_fullscreen

# ── CLIPBOARD ────────────────────────────────────────────────
# Copy selected text; otherwise send Ctrl+C interrupt
map ctrl+c copy_or_interrupt

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Ctrl+V detects clipboard text/images in Codex.
# Other applications retain their Ctrl+V shortcut (including Neovim visual block).
map ctrl+v kitten codex-smart-paste.py

# ── TABS ─────────────────────────────────────────────────────
tab_bar_edge bottom
tab_bar_style fade
tab_bar_min_tabs 2
tab_title_max_length 24

# Create a tab in the current working directory
map ctrl+t launch --cwd=current --type=tab
map ctrl+y launch --cwd=current --type=tab

# Close the current tab
map ctrl+w close_tab
map ctrl+shift+w close_tab

# Switch directly to tabs 1–5
map alt+shift+1 goto_tab 1
map alt+shift+2 goto_tab 2
map alt+shift+3 goto_tab 3
map alt+shift+4 goto_tab 4
map alt+shift+5 goto_tab 5

# ── CUSTOM TERMINAL COLORS ──────────────────────────────────
# Preserved from your original configuration
color8 #414A5B
color3 #A1734C
color4 #0D428B
color7 #A9A9A9
